    <script>
      (function() {
        // 1. Intercept extension errors immediately
        var suppress = function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          var file = (e && (e.filename || (e.error && e.error.stack))) || '';
          if (
            file.indexOf('chrome-extension://') !== -1 ||
            msg.indexOf('Cannot set property fetch') !== -1 ||
            msg.indexOf('only a getter') !== -1
          ) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        };

        window.addEventListener('error', suppress, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (suppress(e.reason || e)) {
            e.preventDefault();
          }
        }, true);

        // 2. Add setter for 'fetch' on Window.prototype and window so Urban VPN / extensions can assign to it
        try {
          var currentFetch = window.fetch;
          var fetchDescriptor = {
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          };

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', fetchDescriptor);
            } catch (_) {}
          }

          try {
            Object.defineProperty(window, 'fetch', fetchDescriptor);
          } catch (_) {}
        } catch (_) {}
      })();
    </script>
